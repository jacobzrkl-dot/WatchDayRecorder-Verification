name: Apple platform verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Test result acceptance rules
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Compile iPhone, Watch, widget and run XCTest
        id: verify
        env:
          VERIFY_ARTIFACTS_DIR: ${{ runner.temp }}/WatchDayRecorderVerify
        run: bash scripts/verify-macos.sh
      - name: Capture iPhone and Watch simulator UI
        shell: bash
        timeout-minutes: 8
        env:
          IOS_SIMULATOR_ID: ${{ steps.verify.outputs.ios_simulator }}
          ARTIFACT_DIRECTORY: ${{ steps.verify.outputs.artifacts }}
        run: bash scripts/capture-simulators.sh "$IOS_SIMULATOR_ID" "$ARTIFACT_DIRECTORY" 2>&1 | tee "$ARTIFACT_DIRECTORY/ui-capture.log"
      - name: Summarize verification without artifact storage
        if: always()
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ steps.verify.outputs.artifacts }}
        run: |
          printf '%s\n' '## Verification evidence' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No build artifacts or caches are uploaded. See job logs for builds and XCTest results.' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$ARTIFACT_DIRECTORY" && -f "$ARTIFACT_DIRECTORY/test-summary.json" ]]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$ARTIFACT_DIRECTORY/test-summary.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
